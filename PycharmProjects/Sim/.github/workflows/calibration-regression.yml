name: Calibration regression

# Runs the calibration harness end-to-end on every PR and push to main.
# Fails if any Brier / AUC / ECE / accuracy metric drifts beyond the
# thresholds in tests/regression_calibration.py::DEFAULT_TOL.
#
# To accept a legitimate change: run `python3 tests/regression_calibration.py
# freeze` locally, commit tests/golden_calibration.json, push.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          # scipy is optional (fallback normal approx exists) — install for
          # tighter chi2 / norm tails
          pip install scipy || true

      - name: Verify goldens present
        run: |
          test -f tests/golden_calibration.json \
            || (echo "::error::tests/golden_calibration.json is missing. \
                    Run 'python3 tests/regression_calibration.py freeze' locally \
                    and commit the result." && exit 2)

      - name: Run calibration regression suite
        run: bash tests/run_regressions.sh check

      - name: Upload calibration report artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-artifacts
          path: |
            runs/calibration/
            tests/golden_calibration.json
